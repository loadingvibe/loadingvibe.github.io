<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-labelledby="title desc">
  <title id="title">频率加载标志</title>
  <desc id="desc">由六段蓝色弧线组成的加载频率符号</desc>
  <defs>
    <linearGradient id="blue" x1="5" y1="34" x2="34" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aab3c2"/>
      <stop offset="0.48" stop-color="#4b86d8"/>
      <stop offset="1" stop-color="#087cff"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-width="4.8" filter="url(#glow)">
    <path d="M9.1 31.4A16 16 0 0 1 5.2 26.2" opacity="0.48"/>
    <path d="M4.3 22.7A16 16 0 0 1 4.8 16.5" opacity="0.58"/>
    <path d="M6 13.2A16 16 0 0 1 9.8 8.3" opacity="0.68"/>
    <path d="M12.8 6.3A16 16 0 0 1 18.7 4.1" opacity="0.8"/>
    <path d="M22.2 4.1A16 16 0 0 1 28.1 6.1" opacity="0.92"/>
    <path d="M31 8.2A16 16 0 0 1 34.2 12.4"/>
  </g>
  <path d="M9.1 31.4c2.1 2 4.8 3.4 7.8 4" fill="none" stroke="#7c8da5" stroke-linecap="round" stroke-width="1.4" opacity="0.62"/>
</svg>
